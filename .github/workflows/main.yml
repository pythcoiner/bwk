name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linter:
    name: "tip: lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88
          components: rustfmt, clippy
          override: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: rustfmt
        run: scripts/ci-checks.sh fmt
      - name: clippy
        run: scripts/ci-checks.sh clippy

  tests:
    name: "tip: test ${{ matrix.toolchain }}"
    needs: linter
    strategy:
      matrix:
        toolchain:
          - 1.88
          - nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev gdb
      - name: tests
        run: scripts/ci-checks.sh tests

  p2p-tests:
    name: "tip: test p2p"
    needs: linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88
          override: true
          profile: minimal
      - name: p2p tests
        run: scripts/ci-checks.sh p2p-tests

  build:
    name: "tip: build ${{ matrix.toolchain }}"
    needs:
      - tests
      - p2p-tests
    strategy:
      matrix:
        toolchain:
          - 1.88
          - nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: build
        run: scripts/ci-checks.sh build
      - name: default build
        run: scripts/ci-checks.sh default-build
