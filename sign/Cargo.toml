[package]
name = "bwk-sign"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true
readme.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
