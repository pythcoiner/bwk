name: Commit history check
on:
  pull_request:
    branches:
      - master

jobs:
  # first we list all commits
  list-commits:
    # Single-commit PRs are already fully covered by main.yml.
    if: github.event.pull_request.commits > 1
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.list.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: |
          git fetch --no-tags --prune --depth=1 origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - id: list
        name: List intermediate commits
        run: |
          # HEAD is the PR tip -- already covered by main.yml.
          # Emit {sha, label} objects so the matrix job name in the GH UI
          # shows "<short sha> <subject>" instead of a raw 40-char SHA.
          range="origin/${GITHUB_BASE_REF}..HEAD~"
          commits=$(git log --reverse --pretty=format:'%H%x09%h %s' "$range" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))
                | map(split("\t") | {sha: .[0], label: .[1]})')
          echo "Intermediate commits: $commits"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"

  # second we start one CI task per commit
  check-commit:
    needs: list-commits
    if: needs.list-commits.outputs.commits != '[]' && needs.list-commits.outputs.commits != ''
    name: ${{ matrix.commit.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.list-commits.outputs.commits) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.commit.sha }}

      - name: Stage ci-checks.sh from PR tip
        run: |
          # Intermediate commits may predate scripts/ci-checks.sh, so pull
          # the script from the PR tip and run it from $RUNNER_TEMP.
          git show ${{ github.event.pull_request.head.sha }}:scripts/ci-checks.sh \
            > "$RUNNER_TEMP/ci-checks.sh"
          chmod +x "$RUNNER_TEMP/ci-checks.sh"

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
          override: true
          profile: minimal

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Run CI checks
        run: "$RUNNER_TEMP/ci-checks.sh"
