[package]
name = "bwk-backend-blindbit-non-async"
version = "0.1.0"
edition = "2021"
repository.workspace = true

[dependencies]
# Core client dependency
spdk-core.workspace = true
spdk-core.default-features = false
spdk-core.features = ["sync"]

# HTTPS via native-tls, which maps to the platform TLS (system openssl on Linux,
# SChannel on Windows, Secure Transport on Apple). Provider is selected explicitly
# in ureq_impl.rs (ureq defaults to rustls, which we don't compile). openssl is
# vendored only on Android, see the android target table below.
ureq = { git = "https://github.com/pythcoiner/ureq.git", branch = "gzip", default-features = false, features = ["gzip", "native-tls"] }

# Logging
log.workspace = true

# Re-export some core types for convenience
bitcoin.workspace = true
thiserror.workspace = true
silentpayments.workspace = true
serde.workspace = true
serde_json.workspace = true
hex = { workspace = true, features = ["serde"] }

# Parallelization
rayon.workspace = true
rayon.optional = true

# Vendor a static openssl only on Android, where native-tls's openssl backend
# looks for certs at the build-host paths.
[target.'cfg(target_os = "android")'.dependencies]
ureq = { git = "https://github.com/pythcoiner/ureq.git", branch = "gzip", features = ["vendored"] }

[dev-dependencies]
blindbitd = { git = "https://github.com/pythcoiner/blindbitd.git" }
reqwest = { version = "0.12", features = ["blocking", "gzip"] }
flate2 = "1"
corepc-node = { version = "0.10.0", features = ["download", "29_0"] }
rand = "0.8"

[features]
default = []
rayon = ["dep:rayon", "spdk-core/parallel"]

