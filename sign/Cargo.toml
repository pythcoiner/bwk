[package]
name = "bwk-sign"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true
readme.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
doctest = false

[dependencies]
crossbeam.workspace = true
bwk-keys.workspace = true
bwk-descriptor.workspace = true
bwk-utils.workspace = true
bip39 = { workspace = true, features = ["rand"] }
serde.workspace = true
serde_json.workspace = true
miniscript.workspace = true
log.workspace = true
spdk-core = { workspace = true, features = ["sync", "bitcoin_32"], optional = true }
bwk-hwi = { workspace = true, features = ["service"], optional = true }

[features]
default = ["hwi", "sp"]
test = ["bwk-utils/test"]
sp = ["dep:spdk-core"]
hwi = ["dep:bwk-hwi"]
