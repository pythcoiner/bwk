name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88
          components: rustfmt, clippy
          override: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: rustfmt
        run: scripts/ci-checks.sh fmt
      - name: clippy
        run: scripts/ci-checks.sh clippy

  tests:
    needs: linter
    strategy:
      matrix:
        toolchain:
          - 1.88
          - nightly
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - name: Install system dependencies
        # gdb: lets the integration-test watchdog dump thread backtraces if a
        # scan ever hangs, so the job fails fast with a trace instead of stalling.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev gdb
      - name: tests
        run: scripts/ci-checks.sh tests

  build:
    needs: tests
    strategy:
      matrix:
        toolchain:
          - 1.88
          - nightly
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: build
        # The build matrix includes Windows, where `run:` defaults to pwsh.
        shell: bash
        run: scripts/ci-checks.sh build
